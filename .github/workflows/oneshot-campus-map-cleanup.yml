name: One-shot campus map cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/oneshot-campus-map-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Update campus map UI
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'studyspace-mobile/App.tsx';
          let app = fs.readFileSync(path, 'utf8');
          app = app.replace("const campusBuildings: { name: string; short: string; style: ViewStyle; entrance?: boolean }[] = [", "const campusBuildings: { name: string; short: string; style: ViewStyle }[] = [");
          app = app.replace("  { name: 'Gebäude W', short: 'W', style: { right: '15%', bottom: '17%', width: '34%', height: 54 }, entrance: true },", "  { name: 'Gebäude W', short: 'W', style: { right: '15%', bottom: '17%', width: '34%', height: 54 } },");
          app = app.replace("          <View style={styles.languageLabel}><Text style={styles.tinyLabel}>Sprachenzentrum</Text><Text style={styles.tinySmall}>4.OG</Text></View>\n", "");
          app = app.replace("                <Text style={[styles.mapBuildingName, available && styles.mapBuildingNameFree]}>{building.name}</Text>\n                {building.entrance && <View style={styles.entrance}><Text style={styles.entranceText}>1</Text></View>}\n", "");
          app = app.replace("  parkingZone: { position: 'absolute', right: '5%', top: '45%', width: '11%', height: '28%', alignItems: 'center', justifyContent: 'center', backgroundColor: '#eef0f3' },", "  parkingZone: { position: 'absolute', right: '12%', top: '47%', width: '9%', height: '19%', alignItems: 'center', justifyContent: 'center', backgroundColor: '#eef0f3' },");
          app = app.replace("  languageLabel: { position: 'absolute', right: '16%', top: '20%', width: '28%', minHeight: 38, alignItems: 'center', justifyContent: 'center', borderRadius: 8, backgroundColor: '#075b9f' },\n", "");
          app = app.replace("  tinySmall: { color: '#fff', fontSize: 9, fontWeight: '800' },\n", "");
          app = app.replace("  mapBuildingName: { marginTop: 2, color: '#e7f1fb', fontSize: 9, fontWeight: '800', textAlign: 'center' },\n  mapBuildingNameFree: { color: '#fff' },\n  entrance: { position: 'absolute', right: -8, top: -8, width: 22, height: 22, borderRadius: 999, alignItems: 'center', justifyContent: 'center', borderWidth: 2, borderColor: '#fff', backgroundColor: c.green },\n  entranceText: { color: '#fff', fontSize: 11, fontWeight: '900' },\n", "");
          fs.writeFileSync(path, app);
          fs.rmSync('.github/workflows/oneshot-campus-map-cleanup.yml', { force: true });
          NODE
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add studyspace-mobile/App.tsx .github/workflows/oneshot-campus-map-cleanup.yml
          git commit -m "Simplify campus map labels"
          git push
